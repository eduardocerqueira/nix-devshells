name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake check — ${{ matrix.flake }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flake:
          - lib
          - flakes/default
          - flakes/latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v15

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: nix flake check
        run: nix flake check "./${{ matrix.flake }}"

  smoke-test:
    name: smoke test — ${{ matrix.flake }}
    runs-on: ubuntu-latest
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - flake: flakes/default
            script: tests/smoke-default.sh
          - flake: flakes/latest
            script: tests/smoke-latest.sh
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v15

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Run smoke test inside dev shell
        run: |
          chmod +x "${{ matrix.script }}"
          nix develop "./${{ matrix.flake }}" --command bash "${{ matrix.script }}"
