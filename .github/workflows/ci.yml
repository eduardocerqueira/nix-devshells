name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The `latest` shell tracks nixpkgs-unstable; without a schedule, upstream breakage
  # is invisible until someone happens to push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # --all-systems matters: without it only the runner's own system is
      # evaluated, so a Darwin-only evaluation error ships green.
      - name: nix flake check (evaluate every system)
        run: nix flake check --all-systems --no-build

      # --no-build above evaluates the checks without running them; formatting
      # is cheap enough to actually build. The smoke checks are covered by the
      # smoke-test job, which also exercises the shellHook.
      - name: nixfmt
        run: |
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          nix build -L ".#checks.$system.format"

  smoke-test:
    name: smoke — ${{ matrix.shell }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [default, latest, ai, devops]
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # Through `nix develop`, so the shellHook runs too — the flake's `checks`
      # cover the same scripts against the package set alone.
      - name: Run smoke test inside dev shell
        run: nix develop ".#${{ matrix.shell }}" --command bash "tests/smoke-${{ matrix.shell }}.sh"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- -x tests/*.sh nix-shortcut.sh
